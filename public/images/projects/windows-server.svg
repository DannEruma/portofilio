<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#060910" />
    </linearGradient>
    <linearGradient id="winHeader" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="winBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a4ef" />
      <stop offset="100%" stop-color="#0078d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bgGrad)" />

  <!-- Server Manager Window -->
  <rect x="25" y="25" width="750" height="450" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Window Header -->
  <rect x="25" y="25" width="750" height="40" rx="10" fill="url(#winHeader)" />
  <rect x="25" y="58" width="750" height="7" fill="url(#winHeader)" />
  
  <!-- Windows Logo 4-grid -->
  <g transform="translate(42, 38)">
    <rect x="0" y="0" width="6.5" height="6.5" fill="#f25022" />
    <rect x="7.5" y="0" width="6.5" height="6.5" fill="#7fba00" />
    <rect x="0" y="7.5" width="6.5" height="6.5" fill="#00a4ef" />
    <rect x="7.5" y="7.5" width="6.5" height="6.5" fill="#ffb900" />
  </g>
  <text x="65" y="49" font-family="'Segoe UI', 'JetBrains Mono', sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">Server Manager — Dashboard (SRV-DC01.corp.internal - Windows Server 2025)</text>

  <!-- Left Sidebar -->
  <rect x="25" y="65" width="170" height="410" fill="#0b0f19" stroke="#1e293b" stroke-width="1" />
  <g font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#94a3b8">
    <rect x="30" y="78" width="160" height="28" rx="4" fill="#0078d4" fill-opacity="0.25" stroke="#0078d4" stroke-width="1" />
    <text x="44" y="96" font-weight="bold" fill="#38bdf8">▶ Dashboard</text>
    <text x="44" y="128">  Local Server</text>
    <text x="44" y="158">  All Servers (3)</text>
    <text x="44" y="188">  AD DS (Active Dir)</text>
    <text x="44" y="218">  DNS Server</text>
    <text x="44" y="248">  DHCP Server</text>
    <text x="44" y="278">  File and Storage</text>
    <text x="44" y="308">  IIS Web Server</text>
    <text x="44" y="338">  Hyper-V Manager</text>
    <text x="44" y="368">  Group Policy</text>
  </g>

  <!-- Roles & Server Groups Tiles -->
  <!-- Tile 1: Active Directory Domain Services -->
  <g transform="translate(210, 80)">
    <rect x="0" y="0" width="265" height="115" rx="8" fill="#161f30" stroke="#25354e" stroke-width="1" />
    <rect x="0" y="0" width="265" height="28" rx="8" fill="#1e2c44" />
    <rect x="0" y="20" width="265" height="8" fill="#1e2c44" />
    <circle cx="15" cy="14" r="4" fill="#22c55e" />
    <text x="26" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Active Directory (AD DS)</text>
    <text x="14" y="48" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#cbd5e1">Domain: corp.internal</text>
    <text x="14" y="68" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Forest Functional: WinServer 2025</text>
    <text x="14" y="88" font-family="'JetBrains Mono', monospace" font-size="10" fill="#4ade80">● 142 Users, 48 Computers OU</text>
    <rect x="185" y="80" width="70" height="22" rx="4" fill="#ff7a59" fill-opacity="0.15" stroke="#ff7a59" stroke-width="1" />
    <text x="195" y="95" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#ff7a59">ONLINE</text>
  </g>

  <!-- Tile 2: DNS & DHCP -->
  <g transform="translate(490, 80)">
    <rect x="0" y="0" width="265" height="115" rx="8" fill="#161f30" stroke="#25354e" stroke-width="1" />
    <rect x="0" y="0" width="265" height="28" rx="8" fill="#1e2c44" />
    <rect x="0" y="20" width="265" height="8" fill="#1e2c44" />
    <circle cx="15" cy="14" r="4" fill="#22c55e" />
    <text x="26" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#ffffff">DNS &amp; DHCP Scope</text>
    <text x="14" y="48" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#cbd5e1">Scope: 192.168.10.0/24</text>
    <text x="14" y="68" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Lease Duration: 8 Days</text>
    <text x="14" y="88" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8">Forward Lookup: corp.internal</text>
  </g>

  <!-- Tile 3: PowerShell / Hyper-V Virtualization Console -->
  <g transform="translate(210, 215)">
    <rect x="0" y="0" width="545" height="235" rx="8" fill="#0c121e" stroke="#1e293b" stroke-width="1" />
    <rect x="0" y="0" width="545" height="26" rx="8" fill="#012456" />
    <text x="15" y="17" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#f8fafc">Windows PowerShell (Administrator)</text>
    
    <g font-family="'JetBrains Mono', monospace" font-size="11" xml:space="preserve">
      <text x="15" y="48" fill="#e2e8f0">PS C:\Users\Administrator&gt; Get-ADDomainController -Filter * | Select Name, IPv4Address</text>
      <text x="15" y="70" fill="#38bdf8">Name      IPv4Address</text>
      <text x="15" y="88" fill="#94a3b8">----      -----------</text>
      <text x="15" y="106" fill="#4ade80">SRV-DC01  192.168.10.2 (Primary Domain Controller)</text>
      <text x="15" y="124" fill="#4ade80">SRV-DC02  192.168.10.3 (Secondary Replica)</text>

      <text x="15" y="152" fill="#e2e8f0">PS C:\Users\Administrator&gt; Get-Service -Name "DNS", "DHCPServer", "NTDS" | Select Status, DisplayName</text>
      <text x="15" y="174" fill="#38bdf8">Status   DisplayName</text>
      <text x="15" y="192" fill="#94a3b8">------   -----------</text>
      <text x="15" y="210" fill="#22c55e">Running  Active Directory Domain Services</text>
      <text x="15" y="228" fill="#22c55e">Running  DNS Server / DHCP Server</text>
    </g>
  </g>
</svg>
