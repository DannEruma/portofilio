<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f18" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>
    <linearGradient id="termHeader" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bgGrad)" />

  <!-- Terminal Window Container -->
  <rect x="25" y="25" width="750" height="450" rx="10" fill="#0b101b" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Terminal Title Bar -->
  <rect x="25" y="25" width="750" height="38" rx="10" fill="url(#termHeader)" />
  <rect x="25" y="55" width="750" height="8" fill="url(#termHeader)" />
  <circle cx="45" cy="44" r="5" fill="#ef4444" />
  <circle cx="60" cy="44" r="5" fill="#eab308" />
  <circle cx="75" cy="44" r="5" fill="#22c55e" />
  <text x="100" y="49" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">dhani@srv-gateway-01: ~ (Ubuntu 24.04.1 LTS Server)</text>

  <!-- Terminal Content Lines -->
  <g font-family="'JetBrains Mono', monospace" font-size="12" xml:space="preserve">
    <!-- Prompt 1 -->
    <text x="45" y="90" fill="#ff7a59" font-weight="bold">dhani@srv-gateway-01</text>
    <text x="215" y="90" fill="#94a3b8">:</text>
    <text x="225" y="90" fill="#38bdf8">~</text>
    <text x="235" y="90" fill="#f8fafc">$ systemctl status nginx docker-compose</text>

    <text x="45" y="115" fill="#22c55e">● nginx.service - A high performance web server and reverse proxy</text>
    <text x="65" y="135" fill="#cbd5e1">   Loaded: loaded (/usr/lib/systemd/system/nginx.service; enabled)</text>
    <text x="65" y="155" fill="#cbd5e1">   Active: <tspan fill="#4ade80" font-weight="bold">active (running)</tspan> since Mon 2026-09-01 08:32:10 UTC; 2 days ago</text>
    <text x="65" y="175" fill="#cbd5e1">   Main PID: 18402 (nginx: master process /usr/sbin/nginx -g daemon on;)</text>

    <!-- Docker ps -->
    <text x="45" y="215" fill="#ff7a59" font-weight="bold">dhani@srv-gateway-01</text>
    <text x="215" y="215" fill="#94a3b8">:</text>
    <text x="225" y="215" fill="#38bdf8">~</text>
    <text x="235" y="215" fill="#f8fafc">$ docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"</text>

    <text x="45" y="240" fill="#64748b" font-weight="bold">NAMES              STATUS              PORTS</text>
    <text x="45" y="262" fill="#38bdf8">traefik-proxy      Up 48 hours         0.0.0.0:80->80/tcp, 0.0.0.0:443->443/tcp</text>
    <text x="45" y="284" fill="#38bdf8">radius-auth-srv    Up 48 hours (healthy) 0.0.0.0:1812-1813/udp</text>
    <text x="45" y="306" fill="#38bdf8">bind9-dns-cache    Up 48 hours         0.0.0.0:53->53/udp</text>
    <text x="45" y="328" fill="#38bdf8">prometheus-agent   Up 48 hours         127.0.0.1:9090->9090/tcp</text>

    <!-- htop Summary / Uptime -->
    <text x="45" y="365" fill="#ff7a59" font-weight="bold">dhani@srv-gateway-01</text>
    <text x="215" y="365" fill="#94a3b8">:</text>
    <text x="225" y="365" fill="#38bdf8">~</text>
    <text x="235" y="365" fill="#f8fafc">$ htop --summary</text>

    <!-- Resource Meter Bars -->
    <text x="45" y="392" fill="#94a3b8">CPU [||||||||||||||||||                    24.5%]  Tasks: 78, 194 thr; 1 running</text>
    <text x="45" y="412" fill="#94a3b8">Mem [|||||||||||||||||||||||||||||||       1.82G/7.76G]  Uptime: 28 days, 14:22:04</text>
    <text x="45" y="432" fill="#94a3b8">Swp [|                                      42.0M/2.00G]  Load avg: 0.18 0.12 0.08</text>

    <!-- Cursor -->
    <text x="45" y="456" fill="#ff7a59" font-weight="bold">dhani@srv-gateway-01</text>
    <text x="215" y="456" fill="#94a3b8">:</text>
    <text x="225" y="456" fill="#38bdf8">~</text>
    <text x="235" y="456" fill="#f8fafc">$ <tspan fill="#ff7a59">█</tspan></text>
  </g>
</svg>
