<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1524" />
      <stop offset="100%" stop-color="#060910" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a59" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2438" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bgGrad)" />
  
  <!-- Topology Grid Lines -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="500" />
    <line x1="320" y1="0" x2="320" y2="500" />
    <line x1="480" y1="0" x2="480" y2="500" />
    <line x1="640" y1="0" x2="640" y2="500" />
  </g>

  <!-- Top Bar / Packet Tracer Header -->
  <rect x="30" y="24" width="740" height="38" rx="8" fill="#131b2c" stroke="#253248" stroke-width="1" />
  <circle cx="50" cy="43" r="5" fill="#ef4444" />
  <circle cx="66" cy="43" r="5" fill="#eab308" />
  <circle cx="82" cy="43" r="5" fill="#22c55e" />
  <text x="110" y="48" font-family="'JetBrains Mono', monospace" font-size="13" fill="#94a3b8">Cisco Packet Tracer v8.2 — Enterprise-WAN-Simulation.pkt [Realtime Mode]</text>
  <rect x="670" y="32" width="85" height="22" rx="4" fill="#0284c7" />
  <text x="685" y="47" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">SIMULATING</text>

  <!-- Connection Links (WAN / LAN) -->
  <g stroke="#ff7a59" stroke-width="2" stroke-dasharray="6 4" opacity="0.8">
    <line x1="400" y1="170" x2="230" y2="280" />
    <line x1="400" y1="170" x2="570" y2="280" />
    <line x1="230" y1="280" x2="130" y2="390" />
    <line x1="230" y1="280" x2="270" y2="390" />
    <line x1="570" y1="280" x2="510" y2="390" />
    <line x1="570" y1="280" x2="670" y2="390" />
  </g>

  <!-- Active Data Packet Pulses -->
  <circle cx="315" cy="225" r="4" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="485" cy="225" r="4" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="180" cy="335" r="4" fill="#22c55e" filter="url(#glow)" />
  <circle cx="620" cy="335" r="4" fill="#22c55e" filter="url(#glow)" />

  <!-- Core Router (Center Top) -->
  <g transform="translate(400, 170)">
    <circle cx="0" cy="0" r="42" fill="url(#cardGrad)" stroke="#ff7a59" stroke-width="2" filter="url(#glow)" />
    <!-- Router Symbol (Crossed Arrows) -->
    <path d="M-18 -8 L-4 -8 L-4 -14 L6 0 L-4 14 L-4 8 L-18 8 Z" fill="#ff7a59" />
    <path d="M18 8 L4 8 L4 14 L-6 0 L4 -14 L4 -8 L18 -8 Z" fill="#ff7a59" />
    <text x="0" y="60" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#ffffff">Core-RTR-01</text>
    <text x="0" y="74" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ff7a59">10.0.0.1 (OSPF Area 0)</text>
  </g>

  <!-- Distribution Switch 1 (Branch A) -->
  <g transform="translate(230, 280)">
    <rect x="-34" y="-22" width="68" height="44" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Switch arrows -->
    <line x1="-20" y1="-6" x2="20" y2="-6" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="20" y1="6" x2="-20" y2="6" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <text x="0" y="38" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#ffffff">DS-Switch-01</text>
    <text x="0" y="50" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">VLAN 10, 20</text>
  </g>

  <!-- Distribution Switch 2 (Branch B) -->
  <g transform="translate(570, 280)">
    <rect x="-34" y="-22" width="68" height="44" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="-20" y1="-6" x2="20" y2="-6" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <line x1="20" y1="6" x2="-20" y2="6" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <text x="0" y="38" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#ffffff">DS-Switch-02</text>
    <text x="0" y="50" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">VLAN 30, 40</text>
  </g>

  <!-- End Devices / Servers -->
  <!-- PC 1 -->
  <g transform="translate(130, 390)">
    <rect x="-24" y="-18" width="48" height="36" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1" />
    <rect x="-18" y="-12" width="36" height="22" rx="2" fill="#0f172a" />
    <circle cx="0" cy="22" r="2" fill="#22c55e" />
    <text x="0" y="36" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">PC-Admin</text>
  </g>
  <!-- Server 1 -->
  <g transform="translate(270, 390)">
    <rect x="-22" y="-22" width="44" height="44" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <line x1="-16" y1="-10" x2="16" y2="-10" stroke="#64748b" stroke-width="2" />
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#64748b" stroke-width="2" />
    <line x1="-16" y1="10" x2="16" y2="10" stroke="#64748b" stroke-width="2" />
    <circle cx="12" cy="-10" r="2" fill="#22c55e" />
    <circle cx="12" cy="0" r="2" fill="#22c55e" />
    <text x="0" y="36" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">DHCP/DNS</text>
  </g>
  <!-- PC 2 -->
  <g transform="translate(510, 390)">
    <rect x="-24" y="-18" width="48" height="36" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1" />
    <rect x="-18" y="-12" width="36" height="22" rx="2" fill="#0f172a" />
    <circle cx="0" cy="22" r="2" fill="#22c55e" />
    <text x="0" y="36" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">PC-Finance</text>
  </g>
  <!-- Web Server -->
  <g transform="translate(670, 390)">
    <rect x="-22" y="-22" width="44" height="44" rx="4" fill="#1e293b" stroke="#ff7a59" stroke-width="1" />
    <line x1="-16" y1="-10" x2="16" y2="-10" stroke="#64748b" stroke-width="2" />
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#64748b" stroke-width="2" />
    <circle cx="12" cy="-10" r="2" fill="#ff7a59" />
    <text x="0" y="36" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">Web-SRV</text>
  </g>
</svg>
