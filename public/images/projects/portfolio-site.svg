<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131d" />
      <stop offset="100%" stop-color="#080b10" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a59" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="browserHeader" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bgGrad)" />

  <!-- Browser Frame -->
  <rect x="25" y="25" width="750" height="450" rx="10" fill="#0d1117" stroke="#252e3e" stroke-width="1.5" />
  
  <!-- Browser Header -->
  <rect x="25" y="25" width="750" height="42" rx="10" fill="url(#browserHeader)" />
  <rect x="25" y="60" width="750" height="7" fill="url(#browserHeader)" />
  <circle cx="48" cy="46" r="5" fill="#ef4444" />
  <circle cx="64" cy="46" r="5" fill="#eab308" />
  <circle cx="80" cy="46" r="5" fill="#22c55e" />
  <!-- Address Bar -->
  <rect x="110" y="34" width="450" height="24" rx="12" fill="#0d1117" stroke="#374151" stroke-width="1" />
  <text x="130" y="50" font-family="'JetBrains Mono', monospace" font-size="11" fill="#9ca3af">🔒 https://dhani.dev/portfolio</text>

  <!-- Mini Navbar in Mockup -->
  <rect x="40" y="80" width="720" height="36" rx="6" fill="#131925" />
  <text x="60" y="103" font-family="'Poppins', sans-serif" font-weight="bold" font-size="13" fill="#ff7a59">Dhani<tspan fill="#ffffff">.</tspan></text>
  <text x="480" y="102" font-family="sans-serif" font-size="10" fill="#94a3b8">Home   About   Skills   Projects   Contact</text>

  <!-- Hero Mockup Layout inside Browser -->
  <!-- Left Column -->
  <g transform="translate(60, 150)">
    <text x="0" y="20" font-family="'Caveat', cursive" font-size="18" fill="#ff7a59">Hello, I'm</text>
    <text x="0" y="60" font-family="'Poppins', sans-serif" font-weight="800" font-size="28" fill="#ffffff">Radhitya Dhimas</text>
    <text x="0" y="95" font-family="'Poppins', sans-serif" font-weight="800" font-size="28" fill="#ff7a59">Ardyansyah</text>
    <text x="0" y="125" font-family="sans-serif" font-weight="600" font-size="12" fill="#94a3b8">Internet Engineering Technology Student</text>
    <rect x="0" y="145" width="280" height="12" rx="3" fill="#1f293d" />
    <rect x="0" y="165" width="220" height="12" rx="3" fill="#1f293d" />

    <!-- Button -->
    <rect x="0" y="195" width="120" height="34" rx="17" fill="url(#coralGrad)" />
    <text x="24" y="217" font-family="sans-serif" font-weight="bold" font-size="11" fill="#ffffff">View Projects</text>
    <rect x="135" y="195" width="100" height="34" rx="17" fill="none" stroke="#475569" stroke-width="1.5" />
    <text x="156" y="217" font-family="sans-serif" font-size="11" fill="#cbd5e1">Contact</text>
  </g>

  <!-- Right Column: Avatar with Orbit Rings and Floating Badges -->
  <g transform="translate(580, 260)">
    <!-- Dashed Ring -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="#ff7a59" stroke-width="1" stroke-dasharray="4 3" opacity="0.4" />
    <circle cx="0" cy="0" r="80" fill="#161f30" stroke="#ff7a59" stroke-width="2" />
    <circle cx="0" cy="-20" r="28" fill="#ff7a59" opacity="0.8" />
    <path d="M-45 60 C-40 20 40 20 45 60 Z" fill="#ff7a59" opacity="0.8" />

    <!-- Mini Floating Badges -->
    <circle cx="-100" cy="-30" r="14" fill="#ffffff" />
    <text x="-106" y="-25" font-family="sans-serif" font-weight="bold" font-size="11" fill="#ea580c">JS</text>

    <circle cx="95" cy="-40" r="14" fill="#ffffff" />
    <text x="91" y="-35" font-family="sans-serif" font-weight="bold" font-size="10" fill="#0284c7">C#</text>

    <circle cx="-60" cy="90" r="14" fill="#ffffff" />
    <text x="-65" y="95" font-family="sans-serif" font-weight="bold" font-size="10" fill="#22c55e">RT</text>

    <circle cx="85" cy="70" r="14" fill="#ffffff" />
    <text x="80" y="75" font-family="sans-serif" font-weight="bold" font-size="11" fill="#f97316">GIT</text>
  </g>
</svg>
